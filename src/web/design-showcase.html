<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhishingEml · 前端设计方案评审</title>
  <style>
    :root {
      --ink: #17211f;
      --muted: #6b7773;
      --line: #dce4df;
      --paper: #f4f7f4;
      --panel: #ffffff;
      --accent: #c8473f;
      --accent-soft: #f6ded9;
      --safe: #3f8064;
      --warn: #c58a31;
      --shadow: 0 20px 45px rgba(25, 43, 35, .10);
      --display: 'Trebuchet MS', 'Segoe UI', sans-serif;
      --mono: Consolas, 'Courier New', monospace;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--display); }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; padding: 28px; }
    .topbar { max-width: 1440px; margin: 0 auto 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .brand { display: flex; gap: 14px; align-items: flex-start; }
    .brand-mark { width: 44px; height: 44px; display: grid; place-items: center; background: var(--ink); color: white; border-radius: 12px; box-shadow: 4px 4px 0 var(--accent); }
    .brand-mark svg { width: 23px; }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 40px); letter-spacing: -.04em; line-height: 1; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .status-chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 13px; background: white; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 0 4px #d9ece2; }
    .stage { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(250px, 300px) 1fr; gap: 20px; }
    .rail, .canvas { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .rail { border-radius: 18px; padding: 20px; align-self: start; position: sticky; top: 20px; }
    .rail h2 { margin: 0 0 6px; font-size: 16px; }
    .rail p { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .option-list { display: grid; gap: 9px; }
    .option { border: 1px solid var(--line); background: #fbfcfb; border-radius: 12px; padding: 13px; text-align: left; transition: .2s ease; }
    .option:hover, .option.active { transform: translateX(4px); border-color: var(--accent); background: var(--accent-soft); }
    .option strong { display: block; font-size: 13px; }
    .option span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .option .swatches { display: flex; gap: 5px; margin-top: 9px; }
    .swatches i { width: 17px; height: 7px; border-radius: 99px; display: block; }
    .recommend { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
    .recommend b { font-size: 12px; }
    .recommend p { margin: 7px 0 0; }
    .canvas { border-radius: 22px; overflow: hidden; min-height: 720px; }
    .canvas-top { padding: 15px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .canvas-top .crumb { font: 500 11px var(--mono); color: var(--muted); }
    .canvas-top .view-tabs { display: flex; gap: 4px; }
    .view-tabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: 7px; font-size: 12px; }
    .view-tabs button.active { background: var(--ink); color: white; }
    .theme { display: none; padding: 27px; color: var(--ink); background: var(--panel); }
    .theme.active { display: block; animation: in .35s ease both; }
    @keyframes in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 23px; }
    .hero-row h2 { margin: 0; font-size: clamp(25px, 3vw, 42px); line-height: .98; letter-spacing: -.06em; max-width: 600px; }
    .hero-row p { max-width: 410px; color: var(--muted); line-height: 1.55; font-size: 13px; margin: 0; }
    .demo-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); gap: 15px; }
    .drop-zone { border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); min-height: 230px; border-radius: 16px; padding: 20px; background: color-mix(in srgb, var(--accent-soft) 36%, white); display: flex; flex-direction: column; justify-content: space-between; transition: .2s; }
    .drop-zone.drag { transform: scale(1.01); background: var(--accent-soft); }
    .drop-zone h3 { margin: 0; font-size: 17px; }
    .drop-zone p { color: var(--muted); font-size: 12px; max-width: 370px; line-height: 1.5; }
    .drop-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: 1px solid var(--ink); border-radius: 8px; padding: 10px 13px; background: var(--ink); color: white; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
    .btn.secondary { background: white; color: var(--ink); border-color: var(--line); }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn svg { width: 14px; height: 14px; }
    .quick-scan { border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: #fbfcfb; }
    .quick-scan .label { color: var(--muted); font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .score { display: flex; align-items: center; gap: 13px; margin: 14px 0; }
    .score-ring { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) 0 73%, #e6ece8 73% 100%); position: relative; }
    .score-ring::after { content: ''; width: 62px; height: 62px; border-radius: 50%; background: #fbfcfb; position: absolute; }
    .score-ring strong { position: relative; z-index: 1; font-size: 22px; }
    .score-copy b { font-size: 15px; display: block; }
    .score-copy span { color: var(--muted); font-size: 11px; }
    .meter { height: 7px; border-radius: 99px; background: #e9efeb; overflow: hidden; }
    .meter i { display: block; height: 100%; width: 73%; background: var(--accent); border-radius: inherit; }
    .section { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; }
    .section-head h3 { margin: 0; font-size: 14px; }
    .section-head span { color: var(--muted); font-size: 11px; }
    .evidence { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .evidence-card { padding: 13px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); text-align: left; }
    .evidence-card .icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--accent); background: var(--accent-soft); margin-bottom: 9px; }
    .evidence-card b { font-size: 12px; display: block; }
    .evidence-card p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .email-preview { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
    .mail-meta { background: #f6f8f6; padding: 13px 15px; display: grid; gap: 5px; font-size: 12px; }
    .mail-meta span { color: var(--muted); display: inline-block; min-width: 58px; font-size: 11px; }
    .mail-body { padding: 16px; font-size: 13px; line-height: 1.65; white-space: pre-line; }
    .mail-link { display: inline-flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 7px; background: #fff4d8; color: #925e12; font: 500 11px var(--mono); }
    .feedback { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 0; color: var(--muted); font-size: 11px; }
    .feedback-actions { display: flex; gap: 6px; }
    .feedback button { border: 1px solid var(--line); background: white; border-radius: 7px; padding: 7px 9px; font-size: 11px; }
    .feedback button:hover, .feedback button.selected { border-color: var(--safe); background: #e5f1e9; color: var(--safe); }
    .toast { position: fixed; left: 50%; bottom: 25px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 11px 15px; border-radius: 9px; color: white; background: var(--ink); font-size: 12px; transition: .25s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Distinct visual languages for comparison, while keeping the same workflow. */
    [data-theme="signal"] { --ink: #f4f7f5; --muted: #9aacaa; --line: #263633; --paper: #111a19; --panel: #172321; --accent: #d4f36a; --accent-soft: #29351d; --safe: #8bd8b0; --shadow: 0 25px 65px rgba(0,0,0,.35); --display: Consolas, 'Courier New', monospace; }
    [data-theme="signal"] .brand-mark { background: var(--accent); color: #101611; box-shadow: 4px 4px 0 #4f6a53; }
    [data-theme="signal"] .canvas-top, [data-theme="signal"] .mail-meta { background: #121c1a; }
    [data-theme="signal"] .rail, [data-theme="signal"] .canvas, [data-theme="signal"] .quick-scan, [data-theme="signal"] .email-preview, [data-theme="signal"] .evidence-card { background: var(--panel); }
    [data-theme="signal"] .drop-zone { background: #1d2b21; }
    [data-theme="signal"] .btn { background: var(--accent); color: #111a19; border-color: var(--accent); }
    [data-theme="signal"] .btn.secondary, [data-theme="signal"] .feedback button { background: transparent; color: var(--ink); border-color: var(--line); }
    [data-theme="signal"] .score-ring { background: conic-gradient(var(--accent) 0 73%, #293833 73% 100%); }
    [data-theme="signal"] .score-ring::after { background: var(--panel); }
    [data-theme="signal"] .meter { background: #293833; }
    [data-theme="signal"] .meter i { background: var(--accent); }
    [data-theme="signal"] .mail-link { background: #30351d; color: var(--accent); }

    [data-theme="paper"] { --ink: #1f2c45; --muted: #68758a; --line: #dfe4ec; --paper: #eef2f7; --panel: #ffffff; --accent: #2464c0; --accent-soft: #deebff; --safe: #2f8764; --display: Georgia, 'Times New Roman', serif; }
    [data-theme="paper"] .subtitle, [data-theme="paper"] .hero-row p, [data-theme="paper"] .drop-zone p, [data-theme="paper"] .evidence-card p, [data-theme="paper"] .mail-body { font-family: 'Segoe UI', sans-serif; }
    [data-theme="paper"] .brand-mark { border-radius: 50%; background: var(--accent); box-shadow: 4px 4px 0 #b8cbe5; }
    [data-theme="paper"] .rail, [data-theme="paper"] .canvas { box-shadow: 0 12px 28px rgba(46, 70, 103, .10); }
    [data-theme="paper"] .drop-zone { border-radius: 2px; background: #f8fbff; }
    [data-theme="paper"] .quick-scan, [data-theme="paper"] .evidence-card { border-radius: 3px; }
    [data-theme="paper"] .btn { border-radius: 3px; }

    [data-theme="pulse"] { --ink: #172034; --muted: #718097; --line: #e5e9f0; --paper: #f4f6fb; --panel: #ffffff; --accent: #ef6a4b; --accent-soft: #ffe6dd; --safe: #45a884; --warn: #d39a45; --display: 'Segoe UI', sans-serif; }
    [data-theme="pulse"] .canvas { border-radius: 30px; }
    [data-theme="pulse"] .rail { border-radius: 24px; }
    [data-theme="pulse"] .brand-mark { background: #172034; border-radius: 15px 15px 15px 4px; box-shadow: 4px 4px 0 #ffc55c; }
    [data-theme="pulse"] .drop-zone { border: 0; background: #fff3ee; border-radius: 24px; }
    [data-theme="pulse"] .quick-scan { background: #172034; color: #f6f8fb; border: 0; border-radius: 24px; }
    [data-theme="pulse"] .quick-scan .label, [data-theme="pulse"] .quick-scan .score-copy span { color: #b7c1d2; }
    [data-theme="pulse"] .score-ring { background: conic-gradient(#ffc55c 0 73%, #303c54 73% 100%); }
    [data-theme="pulse"] .score-ring::after { background: #172034; }
    [data-theme="pulse"] .meter { background: #303c54; }
    [data-theme="pulse"] .meter i { background: #ffc55c; }

    [data-theme="terminal"] { --ink: #d8f5d0; --muted: #82aa83; --line: #29452d; --paper: #09110b; --panel: #0e1b11; --accent: #b8ec78; --accent-soft: #1b351e; --safe: #9de7ad; --shadow: 0 22px 55px rgba(0,0,0,.45); --display: Consolas, 'Courier New', monospace; --mono: Consolas, 'Courier New', monospace; }
    [data-theme="terminal"] .brand-mark { border-radius: 3px; background: transparent; color: var(--accent); border: 1px solid var(--accent); box-shadow: 4px 4px 0 #29452d; }
    [data-theme="terminal"] .canvas-top, [data-theme="terminal"] .mail-meta { background: #0a140c; }
    [data-theme="terminal"] .rail, [data-theme="terminal"] .canvas, [data-theme="terminal"] .quick-scan, [data-theme="terminal"] .email-preview, [data-theme="terminal"] .evidence-card { background: var(--panel); }
    [data-theme="terminal"] .drop-zone { background: #102312; border-radius: 4px; border-style: solid; }
    [data-theme="terminal"] .btn { border-radius: 3px; background: var(--accent); color: #0a140c; border-color: var(--accent); }
    [data-theme="terminal"] .btn.secondary, [data-theme="terminal"] .feedback button { background: transparent; color: var(--ink); border-color: var(--line); }
    [data-theme="terminal"] .score-ring { border-radius: 4px; background: conic-gradient(var(--accent) 0 73%, #1c3420 73% 100%); }
    [data-theme="terminal"] .score-ring::after { border-radius: 2px; background: var(--panel); }
    [data-theme="terminal"] .meter { background: #1c3420; border-radius: 2px; }
    [data-theme="terminal"] .meter i { background: var(--accent); border-radius: 2px; }
    [data-theme="terminal"] .mail-link { border-radius: 2px; background: #1d351e; color: var(--accent); }

    @media (max-width: 940px) { .stage { grid-template-columns: 1fr; } .rail { position: static; } .option-list { grid-template-columns: repeat(2, 1fr); } .recommend { display: none; } }
    @media (max-width: 640px) { .shell { padding: 14px; } .topbar, .hero-row { display: block; } .status-chip { margin-top: 16px; } .canvas-top { padding: 12px 14px; } .theme { padding: 18px 14px 24px; } .demo-grid, .evidence { grid-template-columns: 1fr; } .option-list { grid-template-columns: 1fr; } .hero-row p { margin-top: 13px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 20 6v5c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></div>
        <div><p class="eyebrow">PhishingEml / front-end review</p><h1>四套交互式视觉方向</h1><p class="subtitle">同一套邮件检测流程，不同的视觉气质与操作节奏。</p></div>
      </div>
      <div class="status-chip"><i class="status-dot"></i> 展示数据 · 不访问外部链接</div>
    </header>

    <section class="stage">
      <aside class="rail">
        <h2>选择设计方向</h2>
        <p>点击左侧方案，右侧会切换完整展示页。所有方案都可进行上传、拖拽、展开证据和提交反馈。</p>
        <div class="option-list">
          <button class="option active" data-target="signal"><strong>01 · Signal Console</strong><span>深色安全控制台，强调判断速度与证据链。</span><div class="swatches"><i style="background:#d4f36a"></i><i style="background:#172321"></i><i style="background:#d86c5f"></i></div></button>
          <button class="option" data-target="paper"><strong>02 · Trust Ledger</strong><span>编辑部式浅色审阅台，强调可读性与解释。</span><div class="swatches"><i style="background:#2464c0"></i><i style="background:#eef2f7"></i><i style="background:#dfe4ec"></i></div></button>
          <button class="option" data-target="pulse"><strong>03 · Safety Pulse</strong><span>柔和、高对比的行动面板，适合非技术用户。</span><div class="swatches"><i style="background:#ef6a4b"></i><i style="background:#172034"></i><i style="background:#ffc55c"></i></div></button>
          <button class="option" data-target="terminal"><strong>04 · Mail Terminal</strong><span>复古终端语言，适合课程演示和技术叙事。</span><div class="swatches"><i style="background:#d4f36a"></i><i style="background:#111a19"></i><i style="background:#8bd8b0"></i></div></button>
        </div>
        <div class="recommend"><b>我的推荐</b><p><strong>01 · Signal Console</strong>。它把风险等级、规则证据与下一步动作放在同一视线内，最适合“上传邮件后快速解释为什么危险”的核心场景。</p></div>
      </aside>

      <div class="canvas" id="canvas">
        <div class="canvas-top"><span class="crumb">DEMO / ANALYZE / INTERACTION PREVIEW</span><div class="view-tabs"><button class="active" data-view="analysis">检测</button><button data-view="history">历史</button><button data-view="guide">建议</button></div></div>
        <div class="theme active" id="theme-signal" data-theme="signal"></div>
        <div class="theme" id="theme-paper" data-theme="paper"></div>
        <div class="theme" id="theme-pulse" data-theme="pulse"></div>
        <div class="theme" id="theme-terminal" data-theme="terminal"></div>
      </div>
    </section>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <template id="theme-template">
    <div class="hero-row"><div><p class="eyebrow theme-kicker">MAIL THREAT REVIEW</p><h2 class="theme-title">把“可疑”变成<br>看得懂的证据。</h2></div><p>拖入一封 `.eml`，或粘贴原文。系统只做静态解析，不访问链接、不执行附件。</p></div>
    <div class="demo-grid">
      <div class="drop-zone" tabindex="0"><div><h3>开始一次静态检测</h3><p>支持 `.eml` 文件、邮件原文或内置演示样本。先看输入，再看判断。</p></div><div class="drop-actions"><button class="btn choose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg>选择邮件</button><button class="btn secondary sample">载入演示样本</button></div><input class="file-input" type="file" accept=".eml" hidden></div>
      <div class="quick-scan"><span class="label">latest static scan</span><div class="score"><div class="score-ring"><strong>73</strong></div><div class="score-copy"><b>高风险提示</b><span>模型 0.91 · 规则 40</span></div></div><div class="meter"><i></i></div><p style="font-size:11px;color:var(--muted);line-height:1.5;margin:12px 0 0">发现 3 个需要人工确认的信号。结果仅作风险提示，不代表绝对准确。</p></div>
    </div>
    <div class="section"><div class="section-head"><h3>为什么这样判断</h3><span>3 个关键证据 · 点击卡片展开</span></div><div class="evidence"><button class="evidence-card"><span class="icon">!</span><b>Reply-To 域名不一致</b><p>显示发件人与回复地址来自不同域名。</p></button><button class="evidence-card"><span class="icon">↗</span><b>链接需要复核</b><p>链接使用 HTTP，且显示文本与真实地址不一致。</p></button><button class="evidence-card"><span class="icon">▣</span><b>附件扩展名危险</b><p>发现双扩展名 `notice.pdf.exe`。</p></button></div></div>
    <div class="section"><div class="section-head"><h3>邮件快照</h3><span>原文已转义 · 链接不可点击</span></div><div class="email-preview"><div class="mail-meta"><div><span>主题</span>账户安全验证提醒</div><div><span>发件人</span>客服通知 &lt;notice@example.invalid&gt;</div><div><span>回复至</span>support@secure-check.invalid</div></div><div class="mail-body">您好，系统检测到您的账户存在异常登录。请在 24 小时内完成验证，否则服务可能被暂停。<br><br><span class="mail-link">http://secure-check.invalid/verify · 静态链接</span></div></div><div class="feedback"><span>这个判断对你有帮助吗？</span><div class="feedback-actions"><button data-feedback="confirmed_phishing">确认钓鱼</button><button data-feedback="false_positive">误报</button><button data-feedback="unsure">不确定</button></div></div></div>
  </template>

  <script>
    const template = document.querySelector('#theme-template').innerHTML;
    const themes = ['signal','paper','pulse','terminal'];
    const copy = {
      signal: { kicker: 'MAIL THREAT REVIEW', title: '把“可疑”变成<br>看得懂的证据。' },
      paper: { kicker: 'EDITORIAL SECURITY DESK', title: '像审阅一篇稿件<br>一样读懂风险。' },
      pulse: { kicker: 'SAFETY PULSE', title: '下一步做什么，<br>现在就告诉你。' },
      terminal: { kicker: 'STATIC ANALYSIS / TTY', title: '读原文。看信号。<br>做决定。' }
    };
    themes.forEach(name => {
      const panel = document.querySelector('#theme-' + name);
      panel.innerHTML = template;
      panel.querySelector('.theme-kicker').textContent = copy[name].kicker;
      panel.querySelector('.theme-title').innerHTML = copy[name].title;
    });
    const toast = document.querySelector('#toast');
    let toastTimer;
    function notify(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }
    function activateTheme(name) {
      document.querySelectorAll('.option').forEach(btn => btn.classList.toggle('active', btn.dataset.target === name));
      document.querySelectorAll('.theme').forEach(panel => panel.classList.toggle('active', panel.id === 'theme-' + name));
      document.body.dataset.activeTheme = name;
    }
    document.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => activateTheme(btn.dataset.target)));
    document.querySelectorAll('.view-tabs button').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.view-tabs button').forEach(item => item.classList.remove('active'));
      btn.classList.add('active');
      notify(btn.dataset.view === 'analysis' ? '已回到检测视图' : btn.dataset.view === 'history' ? '历史视图将在下一版接入真实记录' : '建议视图已准备好接入知识库');
    }));
    document.querySelectorAll('.choose').forEach(button => button.addEventListener('click', e => e.currentTarget.closest('.drop-zone').querySelector('.file-input').click()));
    document.querySelectorAll('.file-input').forEach(input => input.addEventListener('change', e => { if (e.target.files[0]) notify('已选择：' + e.target.files[0].name + '（展示模式）'); }));
    document.querySelectorAll('.sample').forEach(button => button.addEventListener('click', () => notify('已载入 phishing_demo.eml · 正在准备静态分析')));
    document.querySelectorAll('.drop-zone').forEach(zone => {
      ['dragenter','dragover'].forEach(type => zone.addEventListener(type, e => { e.preventDefault(); zone.classList.add('drag'); }));
      ['dragleave','drop'].forEach(type => zone.addEventListener(type, e => { e.preventDefault(); zone.classList.remove('drag'); }));
      zone.addEventListener('drop', e => { const file = e.dataTransfer.files[0]; if (file) notify('已拖入：' + file.name + '（展示模式）'); });
      zone.addEventListener('keydown', e => { if (e.key === 'Enter') zone.querySelector('.file-input').click(); });
    });
    document.querySelectorAll('.evidence-card').forEach(card => card.addEventListener('click', () => { card.classList.toggle('selected'); notify(card.classList.contains('selected') ? '证据已展开：可显示规则详情与原文位置' : '已收起证据详情'); }));
    document.querySelectorAll('[data-feedback]').forEach(button => button.addEventListener('click', e => { const group = e.currentTarget.parentElement; group.querySelectorAll('button').forEach(item => item.classList.remove('selected')); e.currentTarget.classList.add('selected'); notify('反馈已记录：' + e.currentTarget.textContent); }));
  </script>
</body>
</html>
